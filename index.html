<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirstDesk Web | Activos TI</title>
    <!-- Framework: Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="text-center py-4 text-white">
        <h1>FirstDesk Web</h1>
        <p>Gestión de Infraestructura y Activos TI</p>
    </header>

    <main class="container my-4">
        <section class="row">
            <aside class="col-md-4 mb-4">
                <div class="card glass-card p-4">
                    <h3>Nuevo Activo</h3>
                    <form id="form-activo">
                        <div class="mb-3">
                            <label for="equipo" class="form-label">Tipo de Equipo</label>
                            <input type="text" id="equipo" class="form-control" placeholder="Ej. Servidor Dell PowerEdge" required>
                        </div>
                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado Operativo</label>
                            <select id="estado" class="form-select" required>
                                <option value="">Seleccione...</option>
                                <option value="Operativo">Operativo</option>
                                <option value="En Mantenimiento">En Mantenimiento</option>
                                <option value="Baja">De Baja</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Registrar Activo</button>
                    </form>
                </div>
            </aside>

            <article class="col-md-8">
                <div class="card glass-card p-4">
                    <h3>Inventario Actual</h3>
                    <div class="table-responsive">
                        <table class="table table-hover mt-3">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Equipo</th>
                                    <th>Estado</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="lista-activos">
                            </tbody>
                        </table>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
